services:
  database:
    image: mysql:9.3
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_USER: user
      MYSQL_PASSWORD: oaiszdiufiansdfo
      MYSQL_DATABASE: summergames
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/initialSetup.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "user", "-poaiszdiufiansdfo"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
    ports:
      - "1313:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer
    ports:
      - "3307:8080"
    restart: unless-stopped

volumes:
  mysql-data:
    driver: local
