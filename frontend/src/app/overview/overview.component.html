<h2>Willkommen, {{ team()?.name || '...' }}!</h2>
<p class="subtitle">{{ team()?.partner1 }} &amp; {{ team()?.partner2 }}</p>

<div class="stats-grid">
  <mat-card class="stat-card won">
    <mat-card-content>
      <mat-icon>emoji_events</mat-icon>
      <div class="stat-number">{{ gamesWon() }}</div>
      <div class="stat-label">Siege</div>
    </mat-card-content>
  </mat-card>
  <mat-card class="stat-card lost">
    <mat-card-content>
      <mat-icon>close</mat-icon>
      <div class="stat-number">{{ gamesLost() }}</div>
      <div class="stat-label">Niederlagen</div>
    </mat-card-content>
  </mat-card>
</div>

<mat-card class="winrate-card">
  <mat-card-header>
    <mat-card-title>Winrate: {{ winRate() | percent }}</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-progress-bar mode="determinate" [value]="winRate() * 100" color="primary"></mat-progress-bar>
  </mat-card-content>
</mat-card>

<div class="actions">
  <button mat-raised-button color="primary" routerLink="/new">+ Ergebnis eintragen</button>
  <button mat-stroked-button routerLink="/plans">Spielplan</button>
  <button mat-stroked-button routerLink="/activities">Alle Spiele</button>
</div>
