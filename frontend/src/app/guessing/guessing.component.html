<h2>Schätzfrage</h2>

<mat-card>
  <mat-card-content>
    <p>Wie viele Aktivitäten werden insgesamt gespielt?</p>
    @if (!entriesOpen()) {
      <p class="closed-hint">Einträge sind aktuell geschlossen.</p>
    }
    <mat-form-field appearance="outline">
      <mat-label>Deine Schätzung</mat-label>
      <input matInput type="number"
             [ngModel]="newGuess()" (ngModelChange)="newGuess.set($event)"
             (keyup.enter)="save()"
             [disabled]="!entriesOpen()"/>
    </mat-form-field>
    @if (currentGuess() !== undefined) {
      <p>Aktuelle Schätzung: <strong>{{ currentGuess() }}</strong></p>
    }
  </mat-card-content>
  <mat-card-actions>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="!entriesOpen()">
      Speichern
    </button>
  </mat-card-actions>
</mat-card>
